<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image de partage : les noms</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { background: #0f1015; color: #e8eaf4; font: 500 14px system-ui, sans-serif; padding: 18px 16px 60px; }
h1 { font: 800 24px system-ui; } .sub { color: #8f98b8; margin: 6px 0 16px; max-width: 800px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(740px, 1fr)); gap: 24px 20px; max-width: 1560px; }
.c h2 { font: 800 16px system-ui; } .c p { color: #8f98b8; font-size: 12px; margin: 2px 0 8px; min-height: 2.6em; }
.box { width: 720px; height: 420px; overflow: hidden; border: 2px solid #000; border-radius: 8px; background: #23262f; } .box img { display: block; }
#st { color: #ffd24d; margin: 8px 0; }
</style></head><body>
<h1>Image de partage : les noms</h1>
<div class="sub">Chaque cadre montre le haut de l'image à taille réelle (sans réduction), pour que tu juges la lisibilité des noms. Mêmes jaquettes partout.</div>
<div id="st">Chargement…</div>
<div class="grid" id="g"></div>
<iframe id="f" src="../index.html" style="display:none"></iframe>
<script>
const f = document.getElementById('f'), st = document.getElementById('st');
const TITLE = { text: 'Anime', style: 'tab', shape: 'slant', size: 44 };
const VAR = [
  ['A · Actuel', 'Texte en bas à gauche sur un dégradé, titres complets, coupés avec « … » s’ils sont longs.', { title: TITLE }],
  ['B · Barre de nom', 'Une barre sombre sur toute la largeur de la jaquette, texte centré. Titres complets.', { title: TITLE, nameStyle: 'bar' }],
  ['C · Titres raccourcis', 'Même style qu’avant, mais « 2nd Season », « Part 2 », les années et les longs sous-titres sont retirés.', { title: TITLE, shortNames: true }],
  ['D · Les trois ensemble', 'Barre de nom + titres raccourcis + taille du texte adaptée à chaque titre.', { title: TITLE, nameStyle: 'bar', shortNames: true, fitNames: true }],
];
f.addEventListener('load', async () => {
  try {
    const w = f.contentWindow; await new Promise((r) => setTimeout(r, 1500)); await w.eval('loadData()');
    const rows = w.eval('animeData').rows.filter((r) => r[1] === 0 && r[7] > 8.0 && r[3]).sort((a, b) => b[7] - a[7]).slice(0, 60);
    const cols = ['#ff7f7f', '#ffbf7f', '#ffdf7f', '#bfff7f', '#7fbfff'];
    const nm = ['Z', 'S', 'A', 'B', 'C'], ds = ['GOAT', 'Chef-d’œuvre', 'Masterclass', 'Incroyable', 'Banger'], cnt = [8, 8, 8, 8, 8];
    const list = { name: 'Anime', tiers: [], items: {} }; let n = 0;
    nm.forEach((x, ti) => { const t = { id: 't' + ti, name: x, color: cols[ti], desc: ds[ti], items: [] }; for (let k = 0; k < cnt[ti] && n < rows.length; k++, n++) { const r = rows[n], key = 'k' + n; list.items[key] = { t: r[0], i: r[3] }; t.items.push(key); } list.tiers.push(t); });
    const g = document.getElementById('g');
    for (const [t, d, opts] of VAR) {
      st.textContent = 'Rendu : ' + t + '…';
      const cv = await w.buildShareImage(list, true, opts);
      const c = document.createElement('div'); c.className = 'c';
      c.innerHTML = '<h2>' + t + '</h2><p>' + d + '</p><div class="box"><img src="' + cv.toDataURL() + '" width="' + cv.width + '"></div>';
      g.append(c);
    }
    st.textContent = '';
  } catch (e) { st.textContent = 'ERREUR : ' + e.message; }
});
</script></body></html>
